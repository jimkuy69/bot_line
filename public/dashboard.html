<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINE AI Admin</title><style>body{font:16px system-ui;background:#111827;color:white;margin:24px}input,textarea,button{padding:10px;margin:5px;border-radius:6px}input,textarea{background:#263449;color:white;border:1px solid #526178}button{background:#22c55e;cursor:pointer;border:0}section{padding:16px;background:#1f2937;margin:15px 0;border-radius:10px}.grid{display:grid;grid-template-columns:35% 1fr;gap:15px}.entry{padding:9px;border-bottom:1px solid #506074;cursor:pointer;white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:700px){.grid{display:block}}textarea{width:85%;height:75px}</style><h2>LINE AI Smart Admin</h2><p>Staging dashboard • API key stays in memory only</p><input id="key" type="password" placeholder="Admin API Key"><button id="connect">Connect</button><p id="status"></p><div class="grid"><div><section><h3>Conversations</h3><button id="refresh">Refresh</button><div id="conversations"></div></section><section><h3>Escalations</h3><div id="cases"></div></section></div><div><section><h3 id="selected">Messages</h3><div id="messages"></div><button id="human">Human mode</button><button id="ai">AI mode</button><textarea id="reply" placeholder="ข้อความจากแอดมิน"></textarea><button id="send">Send</button></section><section><h3>AI Settings (Staging)</h3><p>Draft / Publish / Rollback • Mock preview does not call OpenAI or LINE</p><input id="agentModel" value="gpt-4.1-mini" placeholder="Model"><textarea id="agentPersona" placeholder="บุคลิกและคำสั่ง AI">ตอบภาษาไทยสุภาพ ไม่เดาข้อมูล ส่งต่อเจ้าหน้าที่เมื่อไม่มั่นใจ</textarea><label><input type="checkbox" id="agentEnabled"> Enabled when published</label><div><button id="saveDraft">Save Draft</button><button id="publish">Publish</button><button id="loadAgent">Refresh versions</button></div><input id="mockMessage" placeholder="คำถามทดสอบ (Mock)"><button id="mock">Mock Preview</button><pre id="mockResult" style="white-space:pre-wrap"></pre><div id="versions"></div></section><section><h3>Approved FAQ</h3><div id="knowledge"></div><input id="question" placeholder="คำถาม"><textarea id="answer" placeholder="คำตอบที่อนุมัติ"></textarea><button id="add">Add FAQ</button></section></div></div><script>
let key="",selected="";const E=id=>document.getElementById(id),safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function req(path,opts={}){const r=await fetch("/admin/"+path,{...opts,headers:{"X-Admin-Key":key,"Content-Type":"application/json"}});if(!r.ok)throw Error("HTTP "+r.status);return r.json();}
async function load(){if(!key)return;try{const [con,cas,faq]=await Promise.all([req("conversations"),req("cases"),req("knowledge")]);E("status").textContent="Connected";E("conversations").innerHTML=con.map(x=>'<div class="entry" data-id="'+safe(x.id)+'">'+safe(x.line_user_id)+' / '+safe(x.mode)+'</div>').join("")||"No conversations";document.querySelectorAll("[data-id]").forEach(x=>x.onclick=()=>open(x.dataset.id));E("cases").innerHTML=cas.map(x=>'<div class="entry">'+safe(x.status)+": "+safe(x.summary)+'</div>').join("")||"No cases";E("knowledge").innerHTML=faq.map(x=>'<div class="entry">'+safe(x.question)+' — '+safe(x.answer)+'</div>').join("")||"No FAQ";if(selected)await open(selected);}catch(e){E("status").textContent=e.message;}}
async function open(id){selected=id;const m=await req("conversations/"+encodeURIComponent(id)+"/messages");E("selected").textContent="Conversation "+id;E("messages").innerHTML=m.map(x=>'<div class="entry">'+safe(x.sender)+": "+safe(x.content)+'</div>').join("");}
async function mode(mode){if(!selected)return;await req("conversations/"+encodeURIComponent(selected)+"/mode",{method:"POST",body:JSON.stringify({mode})});await load();}
E("connect").onclick=()=>{key=E("key").value;E("key").value="";load()};E("refresh").onclick=load;E("human").onclick=()=>mode("HUMAN");E("ai").onclick=()=>mode("AI");E("send").onclick=async()=>{if(!selected)return;try{await req("conversations/"+encodeURIComponent(selected)+"/reply",{method:"POST",body:JSON.stringify({text:E("reply").value})});E("reply").value="";await open(selected)}catch(e){alert(e.message)}};E("add").onclick=async()=>{try{await req("knowledge",{method:"POST",body:JSON.stringify({question:E("question").value,answer:E("answer").value})});E("question").value="";E("answer").value="";await load()}catch(e){alert(e.message)}};E("saveDraft").onclick=async()=>{try{await req("agent/draft",{method:"POST",body:JSON.stringify({model:E("agentModel").value,persona:E("agentPersona").value,enabled:E("agentEnabled").checked})});await agents()}catch(e){alert(e.message)}};E("publish").onclick=async()=>{if(!confirm("Publish การตั้งค่า AI? AUTO_REPLY_ENABLED ใน .env ยังเป็นสวิตช์หลัก"))return;try{await req("agent/publish",{method:"POST"});await agents()}catch(e){alert(e.message)}};E("mock").onclick=async()=>{try{const x=await req("agent/preview",{method:"POST",body:JSON.stringify({message:E("mockMessage").value,persona:E("agentPersona").value})});E("mockResult").textContent=JSON.stringify(x,null,2)}catch(e){alert(e.message)}};async function agents(){try{const versions=await req("agent");E("versions").innerHTML=versions.map(x=>'<div class="entry">'+safe(x.state)+' v'+safe(x.version)+' | '+safe(x.model)+' | enabled='+safe(x.enabled)+' <button data-version="'+safe(x.version)+'">Rollback</button></div>').join("")||"No saved versions";document.querySelectorAll("[data-version]").forEach(b=>b.onclick=async()=>{if(confirm("ย้อนกลับไปเวอร์ชัน "+b.dataset.version+" ?")){await req("agent/rollback",{method:"POST",body:JSON.stringify({version:Number(b.dataset.version)})});await agents()}})}catch(e){E("versions").textContent=e.message}}E("loadAgent").onclick=agents;</script></html>
