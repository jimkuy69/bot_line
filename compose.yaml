services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lineai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set_password}
      POSTGRES_DB: lineai
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lineai -d lineai"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://lineai:${POSTGRES_PASSWORD}@db:5432/lineai
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      ADMIN_LINE_USER_ID: ${ADMIN_LINE_USER_ID:-}
      AUTO_REPLY_ENABLED: ${AUTO_REPLY_ENABLED:-false}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    command: ["node","dist/worker.js"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://lineai:${POSTGRES_PASSWORD}@db:5432/lineai
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      ADMIN_LINE_USER_ID: ${ADMIN_LINE_USER_ID:-}
      AUTO_REPLY_ENABLED: ${AUTO_REPLY_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
volumes:
  dbdata:
